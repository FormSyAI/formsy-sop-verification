[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formsy-sop-verification"
version = "0.1.0"
description = "Evidence-bound candidate verification for a frozen FormSy SOP subset"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formsy_sop_verification = ["profiles/*.json"]
