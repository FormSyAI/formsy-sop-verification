[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formsy-sop-verification"
version = "0.2.0"
description = "Evidence-bound FormSy SOP verification with full condition auditing"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formsy_sop_verification = ["profiles/*.json"]
"formsy_sop_verification.trace_audit" = ["provenance.json", "rules/*.json", "rules/*.md", "rules/sop-library/*.json", "rules/sop-library/*.md", "rules/sop-library/**/*.json", "rules/sop-library/**/*.md"]
